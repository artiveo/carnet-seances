<title>Agence du Pâquier</title>

<style>
/* Layout : outil d'agence de gestion locative — tableau de bord « à traiter », circuit d'intervention locataire → agence → artisan → propriétaire, vues par rôle */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#142028; --muted:#5B6873; --line:#D9E0E6;
  --accent:#1B5874; --accent-ink:#FFFFFF; --accent-soft:#E2EDF3;
  --sand:#9C6B2E; --sand-soft:#F5ECDF;
  --red:#B8402F; --red-soft:#F8E2DE; --amber:#A66510; --amber-soft:#FAEEDB; --green:#2B7A50; --green-soft:#E0F1E7; --violet:#6B4E9B; --violet-soft:#EEE8F7;
  --paper:#FFFFFF; --paper-ink:#18232C;
  --f-disp:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1418; --surface:#152027; --ink:#E3EAEF; --muted:#94A3AE; --line:#26343D;
  --accent:#7DBAD6; --accent-ink:#0D1418; --accent-soft:#17303C;
  --sand:#DDAA6A; --sand-soft:#2C2317;
  --red:#F08A79; --red-soft:#341A16; --amber:#E9B260; --amber-soft:#2F2413; --green:#79CF9F; --green-soft:#14291D; --violet:#B9A2E6; --violet-soft:#262036;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#152027; --ink:#E3EAEF; --muted:#94A3AE; --line:#26343D;
  --accent:#7DBAD6; --accent-ink:#0D1418; --accent-soft:#17303C;
  --sand:#DDAA6A; --sand-soft:#2C2317;
  --red:#F08A79; --red-soft:#341A16; --amber:#E9B260; --amber-soft:#2F2413; --green:#79CF9F; --green-soft:#14291D; --violet:#B9A2E6; --violet-soft:#262036;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo-strip{background:var(--sand-soft);color:var(--sand);font-size:12px;text-align:center;padding:6px 16px;font-weight:500}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mono{width:36px;height:36px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:17px;flex:none}
.brand{font-family:var(--f-disp);font-weight:600;font-size:19px;line-height:1.05;flex:1;min-width:140px}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.rolebox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rolebox select{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--surface);font-weight:700;font-size:13px;color:var(--ink)}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0}
.shell{max-width:1120px;margin:0 auto;display:flex}
main{flex:1;min-width:0;padding:16px 16px 100px;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;font-weight:600;position:relative}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs .n{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}
@media (min-width:920px){
  nav.tabs{position:sticky;top:72px;align-self:flex-start;display:flex;flex-direction:column;width:210px;border:0;background:none;padding:16px 8px;gap:4px}
  nav.tabs button{flex-direction:row;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px}
  nav.tabs button[aria-current="true"]{background:var(--accent-soft)}
  nav.tabs .n{position:static;margin-left:auto}
  main{padding-bottom:40px}
}
h1{font-family:var(--f-disp);font-weight:600;font-size:27px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 0;text-transform:uppercase;letter-spacing:.08em}
.sub{color:var(--muted);margin:3px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);text-align:left}
.kpi b{display:block;font-family:var(--f-disp);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.alert b{color:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--accent-soft)}
.row .m{flex:1;min-width:0}.row .t{font-weight:700}.row .d{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);flex:none}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.i-red{background:var(--red-soft);color:var(--red)}.i-amber{background:var(--amber-soft);color:var(--amber)}.i-blue{background:var(--accent-soft);color:var(--accent)}.i-violet{background:var(--violet-soft);color:var(--violet)}.i-green{background:var(--green-soft);color:var(--green)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-new{background:var(--red-soft);color:var(--red)}.p-assign{background:var(--accent-soft);color:var(--accent)}.p-devis{background:var(--violet-soft);color:var(--violet)}.p-plan{background:var(--amber-soft);color:var(--amber)}.p-done{background:var(--green-soft);color:var(--green)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.flow div{font-size:11px;text-align:center;padding:8px 2px;border-radius:8px;background:var(--bg);color:var(--muted);font-weight:600;line-height:1.2}
.flow div.on{background:var(--accent);color:var(--accent-ink)}
.flow div.past{background:var(--accent-soft);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;min-width:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:12px 14px}
.photos figure{margin:0}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.photos figcaption{font-size:12px;color:var(--muted);margin-top:3px}
.addphoto{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;cursor:pointer;padding:6px}
.panel{padding:14px;display:flex;flex-direction:column;gap:10px}
.panel label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.panel select,.panel input[type=text],.panel input[type=number],.panel input[type=date],.panel textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-weight:400;width:100%}
.panel textarea{min-height:80px}
.hint{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.hint.warn{background:var(--violet-soft);color:var(--violet)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:var(--surface);border-color:var(--red);color:var(--red)}
.btn.full{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1}
.log{padding:6px 14px 12px;margin:0;list-style:none}
.log li{position:relative;padding:8px 0 8px 20px;border-left:2px solid var(--line);margin-left:6px;font-size:14px}
.log li::before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.log li small{display:block;color:var(--muted);font-size:12px}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ptabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600}
.ptabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.el{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.el:last-child{border-bottom:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px}
.seg button[aria-pressed="true"][data-v="Neuf"],.seg button[aria-pressed="true"][data-v="Bon état"]{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.seg button[aria-pressed="true"][data-v="Usagé"]{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.seg button[aria-pressed="true"][data-v="Dégradé"]{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.el input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
@media (max-width:520px){.sig{grid-template-columns:1fr}}
.sig label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.sig canvas{width:100%;height:130px;border:1px solid var(--line);border-radius:8px;background:var(--paper);touch-action:none;display:block}
.sig .clear{font-size:12px;border:0;background:none;color:var(--accent);padding:4px 0}
.more{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:420px){.more{grid-template-columns:1fr}}
.more button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.more b{font-size:16px}
.more span{color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,14,18,.55);display:flex;justify-content:center;overflow-y:auto;padding:24px 16px}
.sheetwrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:10px}
.sheetbar{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:8px}
.sheetbar button{background:#fff;color:#142028;border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:30px 26px;font-size:13px;line-height:1.5}
.paper h3{font-family:var(--f-disp);font-size:24px;margin:0 0 4px}
.paper .hd{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #1B5874;padding-bottom:12px;margin-bottom:14px}
.paper .tag{color:#1B5874;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.paper table{width:100%;border-collapse:collapse;margin:6px 0 14px}
.paper th,.paper td{border:1px solid #D5DCE2;padding:6px 8px;text-align:left;vertical-align:top}
.paper th{background:#EEF3F6;font-size:12px}
.paper .ph{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px}
.paper .ph img{width:120px;aspect-ratio:4/3;object-fit:cover;border:1px solid #D5DCE2}
.paper .sigs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.paper .sigs div{border:1px solid #D5DCE2;padding:8px;min-height:110px}
.paper .sigs img{max-height:80px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.empty{padding:18px;text-align:center;color:var(--muted)}
.tiny{font-size:12px;color:var(--muted)}
.hello{display:flex;align-items:center;gap:12px;padding:16px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--sand-soft);color:var(--sand);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--f-disp);font-size:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

V.edls=()=>{

V.edl=()=>{
  const e=EDL.find(x=>x.id===state.p),b=Bn(e.bien);
  if(!e.pieces)e.pieces=b.pieces.map((p,i)=>({nom:p,elements:(ELEMENTS[p]||['Sol','Murs']).map(n=>({nom:n,etat:e.statut==='Finalisé'?'Bon état':'',comm:''})),photos:e.statut==='Finalisé'?[photo(p+' — vue générale',195+i*8)]:[]}));
  if(state.room>=e.pieces.length)state.room=0;
  const pc=e.pieces[state.room],ro=e.statut==='Finalisé';
  return `<div><h1>État des lieux d’${e.type==='Entrée'?'entrée':'sortie'}</h1><p class="sub">${esc(b.nom)} · ${esc(Lc(b.loc).nom)} · ${fmtL(e.date)}</p></div>

  <h2>Vos biens</h2><div class="card">${biens.map(b=>`<div class="row"><span class="ico i-blue">${IC.bldg}</span><div class="m"><div class="t">${esc(b.nom)}</div><div class="d">${esc(Lc(b.loc).nom.split(' (')[0])} · ${esc(b.type)}, ${b.surf} m²</div></div></div>`).join('')}</div>
  <h2>Interventions sur vos biens</h2><div class="card">${ints.map(i=>iRow(i)).join('')}</div>
  <p class="tiny">Le propriétaire suit tout seul ses interventions, avec les photos. Il n’a plus besoin d’appeler l’agence pour savoir où ça en est.</p>`;

V.home_locataire=()=>{
  const l=Lc(AS.locataire),b=BIEN.find(x=>x.loc===l.id),mine=INT.filter(i=>i.bien===b.id);
  return `<div class="card hello"><div class="avatar">${l.nom[0]}</div><div><b style="font-size:18px">Bonjour ${esc(l.nom.split(' ')[0])}</b><div class="tiny">${esc(b.nom)} · espace locataire</div></div></div>
  <button class="btn primary full" data-a="go" data-v="signal">＋ Signaler un problème dans mon logement</button>
  <h2>Mes demandes</h2><div class="card">${mine.map(i=>`<button class="row" data-a="inter" data-id="${i.id}"><span class="ico i-blue">${IC.wrench}</span><div class="m"><div class="t">${esc(i.titre)}</div><div class="d">${i.statut==='Nouvelle'?'Reçue par l’agence':i.statut==='Terminée'?'Réglé':i.art?'Prise en charge par '+esc(Ar(i.art).nom):'En cours'}${i.rdv?' · rendez-vous le '+fmt(i.rdv):''}</div></div><span class="pill ${PCL[i.statut]}">${i.statut==='Devis à valider'?'En cours':i.statut}</span></button>`).join('')||'<div class="empty">Aucune demande</div>'}</div>
  <h2>Mes documents</h2><div class="card"><div class="row"><span class="ico i-green">${IC.clip}</span><div class="m"><div class="t">État des lieux d’entrée</div><div class="d">PDF signé</div></div></div></div>`;
};
V.signal=()=>`<div><h1>Signaler un problème</h1><p class="sub">Une photo et quelques mots, l’agence s’occupe du reste</p></div>
  <div class="card panel">
    <label>Où ?<select id="sg-c"><option>Salle de bain</option><option>Cuisine</option><option>Chambre</option><option>Séjour</option><option>Chauffage</option><option>Porte, fenêtre, volet</option></select></label>
    <label>Qu’est-ce qui ne va pas ?<input type="text" id="sg-t" value="La chasse d’eau coule en continu"></label>
    <label class="addphoto" style="aspect-ratio:auto;padding:18px" id="sg-pl">＋ Prendre une photo<input type="file" accept="image/*" id="sg-img" hidden></label>
    <label style="flex-direction:row;align-items:center;gap:8px;font-weight:500"><input type="checkbox" id="sg-u"> C’est urgent (fuite, plus de chauffage, porte bloquée)</label>

// ---------- Documents ----------
function sheet(title,html){$('#layer').innerHTML=`<div class="overlay" data-a="close"><div class="sheetwrap"><div class="sheetbar"><b>${esc(title)}</b><button data-a="close">Fermer</button></div><div class="paper">${html}</div></div></div>`}
function edlPdf(e){const b=Bn(e.bien),p=Pr(b.prop),l=Lc(b.loc);
  return `<div class="hd"><div><div class="tag">Agence du Pâquier</div><h3>État des lieux d’${e.type==='Entrée'?'entrée':'sortie'}</h3>${fmtL(e.date)}</div><div><b>Logement</b><br>${esc(b.adr)}<br>${esc(b.type)}, ${b.surf} m²</div></div>
  <table><tr><th>Propriétaire</th><th>Locataire</th></tr><tr><td>${esc(p.nom)}<br>représenté par l’Agence du Pâquier</td><td>${esc(l.nom.split(' (')[0])}</td></tr></table>
  ${e.pieces.map(pc=>`<b>${esc(pc.nom)}</b><table><tr><th style="width:40%">Élément</th><th style="width:20%">État</th><th>Commentaire</th></tr>${pc.elements.map(x=>`<tr><td>${esc(x.nom)}</td><td>${esc(x.etat||'—')}</td><td>${esc(x.comm)}</td></tr>`).join('')}</table>${pc.photos.length?`<div class="ph">${pc.photos.map(ph=>`<img src="${ph}" alt="">`).join('')}</div>`:''}`).join('')}
  <div class="sigs"><div>Pour l’agence<br>${e.sig?`<img src="${e.sig.a}" alt="">`:'<em>Signé électroniquement</em>'}</div><div>Le locataire<br>${e.sig?`<img src="${e.sig.l}" alt="">`:'<em>Signé électroniquement</em>'}</div></div>`}
function reportPdf(i){const b=Bn(i.bien),p=Pr(b.prop),a=Ar(i.art);
  return `<div class="hd"><div><div class="tag">Agence du Pâquier</div><h3>Compte rendu d’intervention</h3>${esc(i.titre)}</div><div><b>Pour</b><br>${esc(p.nom)}<br>${esc(b.adr)}</div></div>
  <table><tr><th>Signalé le</th><th>Artisan</th><th>Intervention</th><th>Montant</th></tr><tr><td>${esc(i.quand)}</td><td>${esc(a.nom)}</td><td>${i.rdv?fmtL(i.rdv):'—'}</td><td>${i.devis!=null?euro(i.devis):'—'}</td></tr></table>
  <p><b>Problème :</b> ${esc(i.desc)}</p>
  <b>Photos avant</b><div class="ph" style="margin-top:4px">${i.photos.map(ph=>`<img src="${ph}" alt="">`).join('')||'—'}</div>
  <b>Photos après</b><div class="ph" style="margin-top:4px">${i.apres.map(ph=>`<img src="${ph}" alt="">`).join('')||'—'}</div>
  <p class="tiny" style="color:#5B6873">Document envoyé automatiquement à la clôture de l’intervention.</p>`}

function bindSig(id){const c=document.getElementById(id);if(!c)return;const x=c.getContext('2d');x.lineWidth=3.2;x.lineCap='round';x.strokeStyle='#18232C';let dn=false,last=null;
  const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
  c.addEventListener('pointerdown',e=>{dn=true;last=pos(e);c.setPointerCapture(e.pointerId);c.dataset.s='1'});
  c.addEventListener('pointermove',e=>{if(!dn)return;const p=pos(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>c.addEventListener(n,()=>dn=false));}

function render(){
  renderTop();renderNav();
  const v=state.view==='home'?'home_'+state.role:state.view;
  $('#main').innerHTML=V[v]();
  bindSig('sig-a');bindSig('sig-l');
}
const I=()=>INT.find(x=>x.id===state.p);
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;
  if(a==='close'){if(el.classList.contains('overlay')&&ev.target!==el)return;$('#layer').innerHTML='';return}
  if(a==='back')return back();
  if(a==='nav'){stack.length=0;state={...state,view:d.v,p:null};render();window.scrollTo(0,0);return}
  if(a==='go')return go(d.v,null);
  if(a==='inter'||a==='bien'||a==='edl'){if(a==='edl')state.room=0;return go(a,d.id)}
  if(a==='rappels'||a==='cles')return go(a,null);
  if(a==='fil'){state.fil=d.v;return render()}
  if(a==='newInter')return go('newInter',null);
  if(a==='createInter'){const i={id:uid('i'),bien:$('#ni-b').value,titre:$('#ni-t').value||'Intervention',cat:$('#ni-c').value,par:'Agence (appel du locataire)',quand:'22/10 · 10:05',statut:'Nouvelle',urgent:$('#ni-u').checked,art:null,devis:null,rdv:null,desc:$('#ni-d').value,photos:[],apres:[],log:[{t:'Créée par l’agence',h:'22/10 · 10:05'}]};INT.unshift(i);stack.pop();state={...state,view:'inter',p:i.id};render();toast('Intervention créée');return}
  if(a==='assign'){const i=I();i.art=$('#art').value;i.statut='Artisan assigné';i.log.push({t:'Confiée à '+Ar(i.art).nom+' : demande envoyée sur son téléphone',h:now()});render();toast('Demande envoyée à '+Ar(i.art).nom);return}
  if(a==='devis'){const i=I(),m=+$('#dv').value||0;i.devis=m;
    if(m>SEUIL){i.statut='Devis à valider';i.log.push({t:'Devis de '+euro(m)+' reçu',h:now()},{t:'Au-dessus de '+SEUIL+' € : devis envoyé à '+Pr(Bn(i.bien).prop).nom+' pour accord',h:now()});toast('Devis envoyé au propriétaire pour accord')}
    else{i.statut='Planifiée';i.rdv='2026-10-24';i.log.push({t:'Devis de '+euro(m)+' sous le seuil du mandat : validé',h:now()},{t:'Rendez-vous fixé au 24/10, locataire prévenu',h:now()});toast('Devis validé, rendez-vous fixé')}
    render();return}
  if(a==='relance'){I().log.push({t:'Relance envoyée au propriétaire',h:now()});render();toast('Relance envoyée (démo)');return}
  if(a==='asProprio'){state.role='proprio';stack.length=0;state.view='inter';render();window.scrollTo(0,0);toast('Vous voyez maintenant l’écran du propriétaire');return}
  if(a==='accept'){const i=I();i.statut='Planifiée';i.rdv='2026-10-23';i.log.push({t:'Devis accepté par '+Pr(Bn(i.bien).prop).nom,h:now()},{t:'Rendez-vous fixé le 23/10, locataire prévenu',h:now()});render();toast('Merci, l’agence et l’artisan sont prévenus');return}
  if(a==='refuse'){const i=I();i.statut='Artisan assigné';i.devis=null;i.log.push({t:'Devis refusé par le propriétaire : nouveau devis demandé',h:now()});render();toast('Refus transmis à l’agence');return}
  if(a==='finish'){const i=I();if(!i.apres.length)i.apres.push(photo('Après intervention',140));i.statut='Terminée';i.log.push({t:'Travail terminé, photo après ajoutée',h:now()},{t:'Compte rendu envoyé à '+Pr(Bn(i.bien).prop).nom,h:now()});render();sheet('Compte rendu d’intervention',reportPdf(i));toast('Compte rendu envoyé au propriétaire');return}
  if(a==='report'){return sheet('Compte rendu d’intervention',reportPdf(I()))}
  if(a==='relancer'){const r=RAP.find(x=>x.id===d.id);r.fait=true;render();toast('Relance envoyée au '+r.qui+' (démo)');return}
  if(a==='rendre'){CLE=CLE.filter(k=>k.id!==d.id);render();toast('Clé rendue, retour au coffre');return}
  if(a==='sendSignal'){const l=Lc(AS.locataire),b=BIEN.find(x=>x.loc===l.id);const i={id:uid('i'),bien:b.id,titre:$('#sg-t').value||'Problème signalé',cat:'Plomberie',par:l.nom+' (locataire)',quand:'22/10 · 10:12',statut:'Nouvelle',urgent:$('#sg-u').checked,art:null,devis:null,rdv:null,desc:$('#sg-c').value+' : '+($('#sg-t').value||''),photos:window._sgImg?[window._sgImg]:[photo('Photo du locataire',200)],apres:[],log:[{t:'Demande envoyée par le locataire depuis son téléphone',h:'22/10 · 10:12'}]};window._sgImg=null;INT.unshift(i);back();toast('Demande envoyée, l’agence est prévenue');return}
  // états des lieux
  const e=EDL.find(x=>x.id===state.p);
  if(a==='room'){state.room=+d.i;return render()}
  if(a==='etat'){e.pieces[state.room].elements[+d.j].etat=d.v;return render()}
  if(a==='allGood'){e.pieces[state.room].elements.forEach(x=>{if(!x.etat)x.etat='Bon état'});if(state.room<e.pieces.length-1)state.room++;return render()}
  if(a==='clr'){const c=document.getElementById('sig-'+d.w);c.getContext('2d').clearRect(0,0,c.width,c.height);delete c.dataset.s;return}
  if(a==='finalize'){const miss=e.pieces.filter(p=>p.elements.some(x=>!x.etat));if(miss.length){toast('À compléter : '+miss.map(p=>p.nom).slice(0,2).join(', '));return}
    const ca=$('#sig-a'),cl=$('#sig-l');if(!ca.dataset.s||!cl.dataset.s){toast('Il manque une signature');return}
    e.sig={a:ca.toDataURL(),l:cl.toDataURL()};e.statut='Finalisé';render();sheet('État des lieux',edlPdf(e));toast('État des lieux finalisé');return}
  if(a==='pdf')return sheet('État des lieux',edlPdf(e));
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='role'){state.role=t.value;stack.length=0;state.view='home';state.p=null;render();window.scrollTo(0,0);return}
  if(t.id==='who-a'){AS.artisan=t.value;render();return}
  if(t.id==='sg-img'&&t.files[0]){const r=new FileReader();r.onload=()=>{window._sgImg=r.result;$('#sg-pl').firstChild.textContent='✓ Photo ajoutée '};r.readAsDataURL(t.files[0]);return}
  if(t.dataset.a==='addPhoto'&&t.files[0]){const i=I(),r=new FileReader();r.onload=()=>{(i.statut==='Planifiée'||state.role==='artisan'?i.apres:i.photos).push(r.result);i.log.push({t:'Photo ajoutée',h:now()});render();toast('Photo ajoutée')};r.readAsDataURL(t.files[0]);return}
  if(t.dataset.a==='edlPhoto'){const e=EDL.find(x=>x.id===state.p),fs=[...t.files];let n=fs.length;fs.forEach(f=>{const r=new FileReader();r.onload=()=>{e.pieces[state.room].photos.push(r.result);if(--n===0){render();toast('Photo ajoutée')}};r.readAsDataURL(f)});return}
});
document.addEventListener('input',ev=>{if(ev.target.dataset.a==='comm'){const e=EDL.find(x=>x.id===state.p);e.pieces[state.room].elements[+ev.target.dataset.j].comm=ev.target.value}});
render();
</script>
